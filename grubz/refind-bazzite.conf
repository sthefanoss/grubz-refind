timeout 3
screensaver 0
inactive_icon_brightness 32
selection_animation_ms 120
use_nvram false
scanfor manual
default_selection "+,Bazzite"
resolution max
banner theme/background.png
banner_scale fillscreen
icons_dir theme
big_icon_size 384
small_icon_size 48
selection_big theme/selection.png
hideui label,hints,arrows,badges
showtools

menuentry "Bazzite" {
    icon /EFI/grubz/theme/bazzite.png
    volume 6a921549-1c79-4838-844d-7cb460100b4e
    loader /EFI/fedora/shimx64.efi
}

menuentry "Windows" {
    icon /EFI/grubz/theme/windows.png
    volume ed0c5878-41a5-464c-8be9-0a76eae23058
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
